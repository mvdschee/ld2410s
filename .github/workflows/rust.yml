name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Check formatting
    - name: Check formatting
      run: cargo fmt -- --check

    # Linting (Clippy)
    - name: Run Clippy
      run: cargo clippy --features serial -- -D warnings

    # Build
    - name: Build
      run: cargo build --verbose --features serial

    # Run tests
    - name: Run tests
      run: cargo test --verbose --features serial
