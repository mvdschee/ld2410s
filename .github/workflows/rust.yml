name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install dependencies (Linux)
      - name: Install libudev-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      # Check formatting
      - name: Check formatting
        run: cargo fmt -- --check

      # Linting (Clippy)
      - name: Run Clippy
        run: cargo clippy --features serial -- -D warnings

      # Build
      - name: Build
        run: cargo build --verbose --features serial

      # Run tests
      - name: Run tests
        run: cargo test --verbose --features serial

      # Async feature, and no_std build for the ESP32-C3 target
      - name: Clippy (async)
        run: cargo clippy --features async --all-targets -- -D warnings

      - name: Build no_std (riscv32imc, async)
        run: |
          rustup target add riscv32imc-unknown-none-elf
          cargo build --target riscv32imc-unknown-none-elf --features async
