[package]
name = "ld2410s"
version = "0.3.0"
authors = ["Max van der Schee <26795741+mvdschee@users.noreply.github.com>"]
description = "HLK-LD2410S driver with backend-agnostic UART ownership for serialport or esp-idf-hal"
license = "EUPL-1.2"
repository = "https://github.com/mvdschee/ld2410s"
readme = "README.md"
keywords = ["ld2410s", "radar", "presence", "embedded", "uart"]
categories = ["embedded", "hardware-support", "no-std"]
exclude = ["docs/*.pdf", ".github/", "makefile"]
edition = "2024"

[package.metadata.docs.rs]
features = ["serial", "async"]

[lib]
name = "ld2410s"
crate-type = ["rlib"]

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[[example]]
name = "serial"
path = "examples/serial.rs"
required-features = ["serial"]

[[example]]
name = "calibrate"
path = "examples/calibrate.rs"
required-features = ["serial"]

[[example]]
name = "configure"
path = "examples/configure.rs"
required-features = ["serial"]

[[example]]
name = "esp"
path = "examples/esp.rs"
required-features = ["embedded"]

[[example]]
name = "async_serial"
path = "examples/async_serial.rs"
required-features = ["async"]

[[example]]
name = "async_esp"
path = "examples/async_esp.rs"
required-features = ["embedded", "async"]

[dependencies]
heapless = "0.9.3"
embedded-io-async = { version = "0.7.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }

[features]
default = []
serial = ["serialport"]
embedded = ["esp-idf-hal"]
async = ["embedded-io-async", "embassy-time"]

[dependencies.serialport]
version = "4.10.1"
optional = true

[dependencies.esp-idf-hal]
version = "0.47.0"
optional = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-serial = "5.5.0"
embedded-io-adapters = { version = "0.7.0", features = ["tokio-1"] }
anyhow = "1.0.104"
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
